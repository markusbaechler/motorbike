name: Build & Deploy

# Baut die Astro-Seite samt Routenplaner und deployt sie per rsync über SSH auf
# das green.ch Webhosting. Der Routenplaner (Repo markusbaechler/motorbike) wird
# bei jedem Build frisch mitgebaut und unter /planer/ abgelegt.
on:
  push:
    branches: [main]
  # Erlaubt manuelles Auslösen über den "Actions"-Tab in GitHub.
  workflow_dispatch:
  # Täglicher Neuaufbau um 03:00 UTC (05:00 Sommerzeit), damit vergangene
  # Termine automatisch von der Startseite verschwinden – auch ohne neuen Push.
  schedule:
    - cron: '0 3 * * *'
  # Vom Routenplaner-Repo nach jedem Push dort ausgelöst (Job "notify-website"
  # in dessen Workflow), damit pudgilly.ch/planer/ ohne Handgriff aktuell bleibt.
  repository_dispatch:
    types: [planer-updated]

# Verhindert parallele Deploys, falls schnell hintereinander gepusht wird.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      # Öffentliches Repo: braucht kein eigenes Token.
      - name: Routenplaner auschecken
        uses: actions/checkout@v4
        with:
          repository: markusbaechler/motorbike
          ref: main
          path: planer-src

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            planer-src/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Astro-Seite bauen
        run: npm run build

      - name: Routenplaner bauen
        working-directory: planer-src
        env:
          # Booking.com-Partner-ID des Clubs (Repo → Settings → Secrets and
          # variables → Actions → Variables). Leer = Links ohne Provision.
          VITE_BOOKING_AID: ${{ vars.BOOKING_AID }}
        run: |
          npm ci
          npm run build

      - name: Routenplaner nach dist/planer/ legen
        run: |
          rm -rf dist/planer
          mkdir -p dist/planer
          cp -R planer-src/dist/. dist/planer/
          test -f dist/planer/index.html
          test -f dist/planer/sw.js

      - name: SSH-Key & known_hosts vorbereiten
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Host-Schlüssel des Servers eintragen, damit rsync nicht interaktiv nachfragt.
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy per rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}"

      - name: Aufräumen
        if: always()
        run: rm -f ~/.ssh/deploy_key
